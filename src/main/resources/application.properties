spring.application.name=clone

server.port=8080

# Database Configuration - Now using PostgreSQL
# Why: PostgreSQL is a powerful, open-source object-relational database system.
# Make sure you have created a database named 'kaptur' in your PostgreSQL instance.
spring.datasource.url=jdbc:postgresql://localhost:5432/kaptur?currentSchema=kaptur_schema
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=kaptur_schema
# Hibernate Dialect for PostgreSQL
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── Log Levels ─────────────────────────────────────────────
# Application packages: DEBUG shows per-method traces from @Slf4j loggers
logging.level.com.koustav.kaptur=DEBUG
# SQL statements (replaces raw show-sql so it goes through the leveled log system)
logging.level.org.hibernate.SQL=DEBUG
# Log the actual JDBC bind parameters for every query
logging.level.org.hibernate.orm.jdbc.bind=TRACE
# WARN for transactions/connections to avoid noise, ERROR surfaces DB failures
logging.level.org.springframework.transaction=WARN
logging.level.org.springframework.web=INFO

