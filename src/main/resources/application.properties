spring.application.name=clone

server.port=8080

# Database Configuration - Now using PostgreSQL
# Why: PostgreSQL is a powerful, open-source object-relational database system.
# Make sure you have created a database named 'kaptur' in your PostgreSQL instance.
spring.datasource.url=jdbc:postgresql://localhost:5432/kaptur?currentSchema=kaptur_schema
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=kaptur_schema
# Hibernate Dialect for PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Security Configuration
# JWT Configuration
app.jwtSecret=9a4f2c8d3b7a1e5f8g2h6i0j4k9l3m7n5o1p4q8r2s6t0u4v8w2x6y0z
app.jwtExpirationMs=86400000

