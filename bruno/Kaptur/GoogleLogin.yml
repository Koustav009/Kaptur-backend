info:
  name: Google Login
  type: http
  seq: 3
  tags:
    - auth

http:
  method: POST
  url: "http://127.0.0.1:8080/auth/google"
  body:
    type: json
    data: |-
      {
        "id": "PASTE_GOOGLE_ID_TOKEN_HERE"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("token", res.body.accessToken);
        bru.setVar("refreshToken", res.body.refreshToken);
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Native Google Sign-In: receives a Google ID token from the client, verifies it
  server-side, and returns our backend JWT tokens (same shape as Login).

  Replace `PASTE_GOOGLE_ID_TOKEN_HERE` with a real Google ID token before running.
  On success it also stores `token` / `refreshToken` for later requests.
