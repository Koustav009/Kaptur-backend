info:
  name: Register
  type: http
  seq: 2
  tags:
    - auth

http:
  method: POST
  url: "http://127.0.0.1:8080/auth/register"
  body:
    type: json
    data: |-
      {
        "email": "rupam@gmail.com",
        "password": "12345",
        "name": "Rupam"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Registers a new user (email, password, name). Returns 201 with a plain-text
  confirmation message.

  Note: use an email that is not already registered or the request errors out.
  Unlike Login, this does NOT return tokens, so it does not set `{{token}}`.
