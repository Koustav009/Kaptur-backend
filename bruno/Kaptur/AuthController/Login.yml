info:
  name: Login
  type: http
  seq: 1
  tags:
    - auth

http:
  method: POST
  url: http://127.0.0.1:8080/auth/login
  body:
    type: json
    data: |-
      {
        "email": "rupam@gmail.com",
        "password": "12345"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("token", res.body.accessToken);
        bru.setVar("refreshToken", res.body.refreshToken);
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Authenticates a user with email/password and returns JWT tokens.

  On success this request stores collection variables used by the rest of the
  collection:
  - `token` -> access token, consumed by protected requests via `{{token}}`
  - `refreshToken` -> used by the Refresh Token request

  Run this first to unlock the Events and Photos requests.
