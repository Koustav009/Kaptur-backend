info:
  name: Auth Test
  type: http
  seq: 5
  tags:
    - auth

http:
  method: GET
  url: "http://127.0.0.1:8080/auth/test"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Simple public health check for the `/auth` path. Returns
  "Auth endpoint is working" with 200 OK. Handy for confirming the backend is up
  before running the authenticated requests.
