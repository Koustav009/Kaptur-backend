info:
  name: Refresh Token
  type: http
  seq: 4
  tags:
    - auth

http:
  method: POST
  url: "http://127.0.0.1:8080/auth/refresh"
  body:
    type: json
    data: |-
      {
        "refreshToken": "{{refreshToken}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("token", res.body.accessToken);
        bru.setVar("refreshToken", res.body.refreshToken);
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Exchanges a valid refresh token for a brand-new access token (and a rotated
  refresh token) without re-entering credentials.

  Requires: run Login (or Google Login) first so `{{refreshToken}}` is set.
  On success it refreshes the stored `token` / `refreshToken` variables.
